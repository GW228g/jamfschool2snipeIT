version: 2

project_name: jamfschool2snipeIT

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: jamfschool2snipeIT
    main: .
    binary: jamfschool2snipeIT
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

changelog:
  disable: true
